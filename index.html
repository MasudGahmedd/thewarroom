<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>The WarRoom</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.cdnfonts.com/css/sf-pro-display');
        
        * {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #000000;
            --text-secondary: #536471;
            --border: #eff3f4;
            --hover: #f7f9f9;
            --accent: #000000;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-card: #000000;
            --text-primary: #ffffff;
            --text-secondary: #71767b;
            --border: #2f3336;
            --hover: #16181a;
            --accent: #ffffff;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header */
        .war-room-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-primary);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-content {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Buttons */
        .nav-button {
            padding: 7px 14px;
            border-radius: 9999px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .nav-button:active {
            transform: scale(0.95);
        }

        .nav-button.secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .theme-toggle {
            min-width: 36px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            font-size: 16px;
            flex-shrink: 0;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }

        /* Cards */
        .report-card {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            transition: background-color 0.15s;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .report-card:active {
            background-color: var(--hover);
        }

        .report-card.top-report {
            border: 2px solid var(--accent);
            border-radius: 12px;
            margin: 0 16px 16px 16px;
            border-bottom: 2px solid var(--accent);
        }

        .card-content {
            padding: 14px 16px;
        }

        .top-report .card-content {
            padding: 18px;
        }

        .top-badge {
            position: absolute;
            top: -1px;
            right: -1px;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 9px;
            font-weight: 700;
            padding: 4px 10px;
            letter-spacing: 1.2px;
            border-radius: 0 10px 0 8px;
        }

        /* Avatar */
        .avatar {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }

        .avatar.large {
            width: 48px;
            height: 48px;
            min-width: 48px;
            font-size: 20px;
        }

        /* Typography */
        .journalist-name {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .report-meta {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.3;
        }

        .report-text {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
            margin-top: 10px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 12px;
            padding: 0 16px;
        }

        /* Vote buttons */
        .vote-button {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }

        .vote-button:active {
            transform: scale(0.92);
        }

        .vote-button svg {
            flex-shrink: 0;
        }

        .stats-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .verification-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 17px;
            height: 17px;
            min-width: 17px;
            background: #1d9bf0;
            border-radius: 50%;
            color: white;
            font-size: 10px;
            flex-shrink: 0;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.2s;
            padding: 0;
            overflow: hidden;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px 16px 0 0;
            width: 100%;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overscroll-behavior: contain;
        }

        .modal-header {
            position: sticky;
            top: 0;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .modal-body {
            padding: 16px;
        }

        .close-button {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-primary);
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
        }

        .close-button:active {
            transform: scale(0.9);
            background-color: var(--hover);
        }

        .divider {
            height: 1px;
            background-color: var(--border);
            margin: 16px 0;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* Safe area for iOS */
        @supports (padding: max(0px)) {
            body {
                padding-bottom: env(safe-area-inset-bottom);
            }

            .modal-content {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }

        /* Desktop styles */
        @media (min-width: 640px) {
            .logo {
                font-size: 18px;
            }

            .section-title {
                font-size: 19px;
            }

            .modal-overlay {
                align-items: center;
                padding: 20px;
            }

            .modal-content {
                max-width: 600px;
                border-radius: 16px;
                max-height: 85vh;
            }

            .report-card:hover {
                background-color: var(--hover);
            }

            .vote-button:hover {
                background-color: var(--hover);
                border-color: var(--accent);
            }

            .theme-toggle:hover {
                background-color: var(--hover);
            }

            .nav-button:hover {
                opacity: 0.85;
            }
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Pull to refresh prevention */
        body {
            overscroll-behavior-y: contain;
        }
    </style>
</head>
<body>
    
    <!-- Header -->
    <header class="war-room-header">
        <div class="header-content">
            <h1 class="logo">The WarRoom</h1>
            <div class="header-actions">
                <button class="nav-button secondary" onclick="showSubmitForm()" style="display: none;" id="submitBtn">Submit</button>
                <button class="nav-button" onclick="showSubmitForm()">+</button>
                <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                    <span id="themeIcon">◐</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main style="max-width: 600px; margin: 0 auto;">
        
        <!-- Top Report Section -->
        <div style="padding: 20px 0 0 0;">
            <h2 class="section-title">Top Report</h2>
            <div id="topReport"></div>
        </div>

        <div class="divider" style="margin: 20px 16px;"></div>

        <!-- Feed Section -->
        <div style="padding-bottom: 24px;">
            <h2 class="section-title">Live Feed</h2>
            <div id="storyFeed"></div>
        </div>

    </main>

    <!-- Modal -->
    <div id="reportModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 style="font-size: 16px; font-weight: 700; margin: 0;">Report Details</h3>
                <button class="close-button" onclick="closeModal()" aria-label="Close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M18 6L6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="modalContent" class="modal-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>

    const SUPABASE_URL = "https://gmqnjseeefjkdzhkxwla.supabase.co"
    const SUPABASE_KEY = "sb_publishable_dccyACJ-Hv1vt1x74pjglA_oj5cALg9"
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    let reports = []
    let currentTheme = localStorage.getItem('theme') || 'dark'

    // Initialize
    function init() {
        initTheme()
        loadReports()
        
        // Show submit button text on wider screens
        if (window.innerWidth >= 480) {
            document.getElementById('submitBtn').style.display = 'inline-block'
        }
    }

    function initTheme() {
        document.documentElement.setAttribute('data-theme', currentTheme)
        updateThemeIcon()
        updateMetaThemeColor()
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', currentTheme)
        localStorage.setItem('theme', currentTheme)
        updateThemeIcon()
        updateMetaThemeColor()
    }

    function updateThemeIcon() {
        document.getElementById('themeIcon').textContent = currentTheme === 'light' ? '◑' : '◐'
    }

    function updateMetaThemeColor() {
        const metaThemeColor = document.querySelector('meta[name="theme-color"]')
        metaThemeColor.setAttribute('content', currentTheme === 'light' ? '#ffffff' : '#000000')
    }

    function getVoteScore(report) {
        return report.upvotes - report.downvotes
    }

    async function loadReports() {
        const { data, error } = await supabaseClient
            .from("reports")
            .select("*")
            .order("created_at", {ascending: false})

        if (error) {
            console.log(error)
            return
        }

        reports = data
        renderFeed()
        renderTopReport()
    }

    async function handleVote(reportId, voteType, event) {
        event.stopPropagation()

        const report = reports.find(r => r.id === reportId)
        if (!report) return

        let upvotes = report.upvotes
        let downvotes = report.downvotes

        if (voteType === "up") {
            upvotes++
        } else {
            downvotes++
        }

        const { error } = await supabaseClient
            .from("reports")
            .update({
                upvotes: upvotes,
                downvotes: downvotes
            })
            .eq("id", reportId)

        if (error) {
            console.log(error)
            return
        }

        await loadReports()
    }

    function formatDate(dateString) {
        const date = new Date(dateString)
        const now = new Date()
        const diffMs = now - date
        const diffMins = Math.floor(diffMs / 60000)
        const diffHours = Math.floor(diffMs / 3600000)
        const diffDays = Math.floor(diffMs / 86400000)

        if (diffMins < 1) return 'now'
        if (diffMins < 60) return `${diffMins}m`
        if (diffHours < 24) return `${diffHours}h`
        if (diffDays < 7) return `${diffDays}d`
        
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    }

    function createStoryCard(report, isTop = false) {
        const score = getVoteScore(report)
        
        return `
        <div class="report-card ${isTop ? 'top-report' : ''}" onclick="openModal('${report.id}')" style="position: relative;">
            ${isTop ? '<div class="top-badge">TOP</div>' : ''}
            
            <div class="card-content">
                <div style="display: flex; gap: 12px;">
                    <div class="avatar ${isTop ? 'large' : ''}">
                        ${report.journalist.charAt(0).toUpperCase()}
                    </div>
                    
                    <div style="flex: 1; min-width: 0;">
                        <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px;">
                            <span class="journalist-name">${report.journalist}</span>
                            ${report.verified ? '<span class="verification-badge">✓</span>' : ''}
                            <span class="report-meta">· ${formatDate(report.created_at)}</span>
                        </div>
                        
                        <div class="report-meta" style="margin-bottom: 2px;">
                            ${report.location}
                        </div>
                        
                        <div class="report-text">
                            ${report.text}
                        </div>
                        
                        <div class="stats-row">
                            <button class="vote-button" onclick="handleVote('${report.id}', 'up', event)" aria-label="Upvote">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M12 19V5M5 12l7-7 7 7"/>
                                </svg>
                                <span>${report.upvotes}</span>
                            </button>
                            
                            <button class="vote-button" onclick="handleVote('${report.id}', 'down', event)" aria-label="Downvote">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                    <path d="M12 5v14M19 12l-7 7-7-7"/>
                                </svg>
                                <span>${report.downvotes}</span>
                            </button>
                            
                            <span class="report-meta">
                                Score: <span style="font-weight: 600; color: var(--text-primary);">${score}</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        `
    }

    function renderFeed() {
        const feed = document.getElementById("storyFeed")
        feed.innerHTML = reports
            .map(report => createStoryCard(report, false))
            .join("")
    }

    function renderTopReport() {
        const topElement = document.getElementById("topReport")

        if (reports.length === 0) {
            topElement.innerHTML = '<div style="padding: 32px 16px; text-align: center;"><span class="report-meta">No reports yet</span></div>'
            return
        }

        const topReport = reports.reduce((top, current) =>
            getVoteScore(current) > getVoteScore(top) ? current : top
        )

        topElement.innerHTML = createStoryCard(topReport, true)
    }

    function openModal(reportId) {
        const report = reports.find(r => r.id === reportId)
        if (!report) return

        const score = getVoteScore(report)
        const modal = document.getElementById('reportModal')
        const modalContent = document.getElementById('modalContent')

        modalContent.innerHTML = `
            <div style="display: flex; gap: 14px; margin-bottom: 20px;">
                <div class="avatar large">
                    ${report.journalist.charAt(0).toUpperCase()}
                </div>
                
                <div style="flex: 1; min-width: 0;">
                    <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px;">
                        <span class="journalist-name" style="font-size: 16px;">${report.journalist}</span>
                        ${report.verified ? '<span class="verification-badge">✓</span>' : ''}
                    </div>
                    
                    <div class="report-meta">
                        ${report.location}
                    </div>
                    <div class="report-meta">
                        ${new Date(report.created_at).toLocaleString()}
                    </div>
                </div>
            </div>
            
            <div class="report-text" style="font-size: 16px; line-height: 1.6; margin-bottom: 20px;">
                ${report.text}
            </div>
            
            <div class="divider"></div>
            
            <div class="stats-row">
                <button class="vote-button" onclick="handleVote('${report.id}', 'up', event)" aria-label="Upvote">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 19V5M5 12l7-7 7 7"/>
                    </svg>
                    <span>${report.upvotes}</span>
                </button>
                
                <button class="vote-button" onclick="handleVote('${report.id}', 'down', event)" aria-label="Downvote">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M12 5v14M19 12l-7 7-7-7"/>
                    </svg>
                    <span>${report.downvotes}</span>
                </button>
                
                <span class="report-meta">
                    Overall Score: <span style="font-weight: 600; color: var(--text-primary); font-size: 15px;">${score}</span>
                </span>
            </div>
        `

        modal.classList.add('active')
        document.body.style.overflow = 'hidden'
    }

    function closeModal(event) {
        if (event && event.target.id !== 'reportModal' && !event.currentTarget.classList.contains('close-button')) return
        
        const modal = document.getElementById('reportModal')
        modal.classList.remove('active')
        document.body.style.overflow = 'auto'
    }

    function showSubmitForm() {
        alert('Submit Report feature coming soon!')
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeModal({ target: { id: 'reportModal' } })
        }
    })

    // Handle resize
    window.addEventListener('resize', () => {
        if (window.innerWidth >= 480) {
            document.getElementById('submitBtn').style.display = 'inline-block'
        } else {
            document.getElementById('submitBtn').style.display = 'none'
        }
    })

    // Initialize app
    init()

    </script>

</body>
</html>
