<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WarRoom Admin Dashboard</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#000;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

.card{
background:#0b0b0b;
border:1px solid #262626;
border-radius:12px;
padding:20px;
}

</style>

</head>

<body>

<!-- LOGIN SCREEN -->

<div id="loginScreen" class="flex items-center justify-center h-screen">

<div class="card w-[400px] text-center">

<h1 class="text-2xl mb-6 font-bold">WarRoom Admin</h1>

<input
id="passwordInput"
type="password"
placeholder="Enter Admin Password"
class="w-full bg-black border border-gray-700 p-3 rounded mb-4"
/>

<button onclick="checkPassword()" class="w-full bg-white text-black p-3 rounded">
Enter Dashboard
</button>

<p id="errorText" class="text-red-400 mt-3 hidden">
Wrong password
</p>

</div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden p-8">

<h1 class="text-3xl font-bold mb-8">
WarRoom Intelligence Dashboard
</h1>

<!-- STATS -->

<div class="grid md:grid-cols-4 gap-6 mb-8">

<div class="card">
<p class="text-gray-400">Reports</p>
<p id="totalReports" class="text-3xl font-bold">0</p>
</div>

<div class="card">
<p class="text-gray-400">Votes</p>
<p id="totalVotes" class="text-3xl font-bold">0</p>
</div>

<div class="card">
<p class="text-gray-400">Comments</p>
<p id="totalComments" class="text-3xl font-bold">0</p>
</div>

<div class="card">
<p class="text-gray-400">Journalists</p>
<p id="totalJournalists" class="text-3xl font-bold">0</p>
</div>

</div>


<!-- COMMENTS + VOTES -->

<div class="grid md:grid-cols-2 gap-6">

<div class="card">

<h2 class="text-xl mb-4">Recent Comments</h2>

<div id="commentsList"></div>

</div>

<div class="card">

<h2 class="text-xl mb-4">Recent Votes</h2>

<div id="votesList"></div>

</div>

</div>


<!-- REPORTS -->

<div class="card mt-8">

<h2 class="text-xl mb-4">Recent Reports</h2>

<div id="reportsList"></div>

</div>

</div>


<script>

/* PASSWORD CHECK */

function checkPassword(){

const password=document.getElementById("passwordInput").value

if(password==="75516905.warroom"){

document.getElementById("loginScreen").style.display="none"
document.getElementById("dashboard").style.display="block"

initDashboard()

}else{

document.getElementById("errorText").classList.remove("hidden")

}

}


/* SUPABASE CLIENT */

const supabaseClient = window.supabase.createClient(
"https://gmqnjseeefjkdzhkxwla.supabase.co",
"sb_publishable_dccyACJ-Hv1vt1x74pjglA_oj5cALg9"
)


/* DASHBOARD INIT */

async function initDashboard(){

loadStats()
loadComments()
loadVotes()
loadReports()

}


/* STATS */

async function loadStats(){

let {count:reports}=await supabaseClient
.from("reports")
.select("*",{count:"exact",head:true})

let {count:votes}=await supabaseClient
.from("report_votes")
.select("*",{count:"exact",head:true})

let {count:comments}=await supabaseClient
.from("comments")
.select("*",{count:"exact",head:true})

let {count:journalists}=await supabaseClient
.from("journalists")
.select("*",{count:"exact",head:true})

document.getElementById("totalReports").innerText=reports||0
document.getElementById("totalVotes").innerText=votes||0
document.getElementById("totalComments").innerText=comments||0
document.getElementById("totalJournalists").innerText=journalists||0

}


/* COMMENTS */

async function loadComments(){

let {data}=await supabaseClient
.from("comments")
.select("*")
.order("created_at",{ascending:false})
.limit(10)

const container=document.getElementById("commentsList")

container.innerHTML=""

if(!data) return

data.forEach(c=>{

container.innerHTML+=`

<div class="border-b border-gray-800 py-2 text-sm">

${c.content || "No text"}

<p class="text-gray-500 text-xs">
Report: ${c.report_id}
</p>

</div>

`

})

}


/* VOTES */

async function loadVotes(){

let {data}=await supabaseClient
.from("report_votes")
.select("*")
.order("created_at",{ascending:false})
.limit(10)

const container=document.getElementById("votesList")

container.innerHTML=""

if(!data) return

data.forEach(v=>{

container.innerHTML+=`

<div class="border-b border-gray-800 py-2 text-sm">

Vote: ${v.vote_type}

<p class="text-gray-500 text-xs">
Report: ${v.report_id}
</p>

</div>

`

})

}


/* REPORTS */

async function loadReports(){

let {data}=await supabaseClient
.from("reports")
.select("*")
.order("created_at",{ascending:false})
.limit(10)

const container=document.getElementById("reportsList")

container.innerHTML=""

if(!data) return

data.forEach(r=>{

container.innerHTML+=`

<div class="border-b border-gray-800 py-3">

<h3 class="font-semibold">${r.title}</h3>

<p class="text-sm text-gray-400">
${(r.content || "").substring(0,120)}
</p>

<p class="text-xs text-gray-500">
Upvotes: ${r.upvotes} | Downvotes: ${r.downvotes}
</p>

</div>

`

})

}

</script>

</body>
</html>
