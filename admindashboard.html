<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WarRoom Admin</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
background:#000;
color:white;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

/* star background */

.stars{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:url("https://www.transparenttextures.com/patterns/stardust.png");
opacity:0.15;
pointer-events:none;
}

.card{
background:#0b0b0b;
border:1px solid #2a2a2a;
border-radius:14px;
padding:20px;
}

</style>

</head>

<body>

<div class="stars"></div>

<!-- PASSWORD SCREEN -->

<div id="loginScreen" class="flex items-center justify-center h-screen">

<div class="card w-[420px] text-center">

<h1 class="text-2xl mb-6 font-bold">WarRoom Admin</h1>

<input
id="passwordInput"
type="password"
placeholder="Enter Admin Password"
class="w-full bg-black border border-gray-700 p-3 rounded mb-4"
/>

<button onclick="checkPassword()" class="w-full bg-white text-black p-3 rounded">
Enter Dashboard
</button>

<p id="error" class="text-red-400 mt-3 hidden">Incorrect password</p>

</div>

</div>

<!-- DASHBOARD -->

<div id="dashboard" class="hidden p-8">

<h1 class="text-3xl font-bold mb-8">WarRoom Intelligence Dashboard</h1>

<!-- analytics cards -->

<div class="grid grid-cols-4 gap-6 mb-8">

<div class="card">
<p class="text-gray-400">Reports</p>
<p id="reportsCount" class="text-3xl font-bold">0</p>
</div>

<div class="card">
<p class="text-gray-400">Votes</p>
<p id="votesCount" class="text-3xl font-bold">0</p>
</div>

<div class="card">
<p class="text-gray-400">Comments</p>
<p id="commentsCount" class="text-3xl font-bold">0</p>
</div>

<div class="card">
<p class="text-gray-400">Journalists</p>
<p id="journalistsCount" class="text-3xl font-bold">0</p>
</div>

</div>

<!-- activity + reports -->

<div class="grid grid-cols-2 gap-8">

<div class="card">

<h2 class="text-xl mb-4">Recent Comments</h2>

<div id="commentsFeed"></div>

</div>

<div class="card">

<h2 class="text-xl mb-4">Recent Votes</h2>

<div id="votesFeed"></div>

</div>

</div>

<div class="card mt-8">

<h2 class="text-xl mb-4">Reports</h2>

<table class="w-full">

<thead class="text-left text-gray-400">
<tr>
<th>Title</th>
<th>Upvotes</th>
<th>Downvotes</th>
<th>Created</th>
</tr>
</thead>

<tbody id="reportsTable"></tbody>

</table>

</div>

</div>

<script>

/* PASSWORD */

function checkPassword(){

const pass=document.getElementById("passwordInput").value

if(pass==="75516905.warroom"){

document.getElementById("loginScreen").style.display="none"
document.getElementById("dashboard").style.display="block"

loadDashboard()

}else{

document.getElementById("error").style.display="block"

}

}

/* SUPABASE */

const supabase = window.supabase.createClient(
"https://gmqnjseeefjkdzhkxwla.supabase.co",
"sb_publishable_dccyACJ-Hv1vt1x74pjglA_oj5cALg9"
)

async function loadDashboard(){

loadCounts()
loadReports()
loadComments()
loadVotes()

}

/* COUNTS */

async function loadCounts(){

let {count:reports}=await supabase.from("reports").select("*",{count:"exact",head:true})
let {count:votes}=await supabase.from("report_votes").select("*",{count:"exact",head:true})
let {count:comments}=await supabase.from("comments").select("*",{count:"exact",head:true})
let {count:journalists}=await supabase.from("journalists").select("*",{count:"exact",head:true})

document.getElementById("reportsCount").innerText=reports
document.getElementById("votesCount").innerText=votes
document.getElementById("commentsCount").innerText=comments
document.getElementById("journalistsCount").innerText=journalists

}

/* REPORTS */

async function loadReports(){

let {data}=await supabase
.from("reports")
.select("*")
.order("created_at",{ascending:false})
.limit(10)

let table=document.getElementById("reportsTable")
table.innerHTML=""

data.forEach(r=>{

table.innerHTML+=`

<tr class="border-t border-gray-800">

<td class="py-3">${r.title}</td>
<td>${r.upvotes}</td>
<td>${r.downvotes}</td>
<td>${r.created_at}</td>

</tr>

`

})

}

/* COMMENTS */

async function loadComments(){

let {data}=await supabase
.from("comments")
.select("*")
.order("created_at",{ascending:false})
.limit(10)

let feed=document.getElementById("commentsFeed")
feed.innerHTML=""

data.forEach(c=>{

feed.innerHTML+=`

<div class="border-b border-gray-800 py-2 text-sm">
${c.content}
</div>

`

})

}

/* VOTES */

async function loadVotes(){

let {data}=await supabase
.from("report_votes")
.select("*")
.order("created_at",{ascending:false})
.limit(10)

let feed=document.getElementById("votesFeed")
feed.innerHTML=""

data.forEach(v=>{

feed.innerHTML+=`

<div class="border-b border-gray-800 py-2 text-sm">
${v.vote_type} on report ${v.report_id}
</div>

`

})

}

</script>

</body>

</html>
